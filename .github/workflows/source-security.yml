name: Source and security gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and offline regression tests
        shell: powershell
        run: ./scripts/build.ps1 -Test
      - name: Focused credential guard
        shell: powershell
        run: |
          python scripts/check-security.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install checksummed Gitleaks
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $scannerDir = Join-Path $env:RUNNER_TEMP 'motorph-gitleaks'
          New-Item -ItemType Directory -Force -Path $scannerDir | Out-Null
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_windows_x64.zip --dir $scannerDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $scannerDir 'gitleaks_8.30.1_windows_x64.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $scannerDir
          $scannerDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Redacted secret and dependency gates
        shell: powershell
        run: |
          python scripts/check-repository.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-dependencies.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Runtime SQL assurance is deliberately separate: it needs the prepared,
      # owned clone and is required by scripts/verify.ps1 -Integration.
